<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0c1b24">
  <title>AI Lab Club</title>
  <link rel="icon" href="/labs-test/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/labs-test/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/labs-test/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <script type="module" crossorigin src="/labs-test/assets/index-DCKdFNUJ.js"></script>
  <link rel="modulepreload" crossorigin href="/labs-test/assets/rolldown-runtime-Dd_uD5pT.js">
  <link rel="stylesheet" crossorigin href="/labs-test/assets/index-adp0SQzW.css">
</head>
<body>
  <div id="app" class="app"></div>
  <noscript>AI Lab needs JavaScript.</noscript>
  <script>
    // Power Run 2 is a separate page (labs-test/power-run-2), so its tile is added to the lab list here,
    // straight after the original Power Run. The list can redraw, so the tile is re-added when it does.
    new MutationObserver(() => {
      const first = document.querySelector('.mgrid a.mtile[href="./?m=powerrun"]');
      if (!first || first.parentElement.querySelector('[data-pr2]')) return;
      const tile = first.cloneNode(true);
      tile.dataset.pr2 = '';
      tile.href = '/labs-test/power-run-2/';
      tile.querySelector('b').textContent = 'Power Run 2';
      tile.querySelector('small').textContent = 'Eco Town · Energy · New';
      first.after(tile);
      first.parentElement.querySelectorAll('.mt-n').forEach((n, i) => { n.textContent = i + 1; });
    }).observe(document.getElementById('app'), { childList: true, subtree: true });
  </script>
</body>
</html>
