<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Power Run Film</title>
<link rel="stylesheet" href="/css/game.css?v=20261018b">
<style>
@font-face { font-family:'Bricolage Grotesque'; font-style:normal; font-weight:200 800; font-stretch:75% 100%; src:url(/assets/fonts/bricolage.woff2) format('woff2'); }
@font-face { font-family:'Inter'; font-style:normal; font-weight:100 900; src:url(/assets/fonts/inter.woff2) format('woff2'); }
:root { --ink:#0C1B24; --green:#1f9d55; --mint:#16FFC6; --blue:#2b6fe0; --sky:#59C7FC; --sun:#FFD23F; --pink:#ff4f8b; --orange:#ff8a1f; --pop:cubic-bezier(.2,1.5,.4,1); --ease:cubic-bezier(.2,.7,.2,1); }
html, body { margin:0; background:#111; }
body { display:grid; place-items:center; min-height:100vh; }
.film { width:540px; height:540px; border-radius:0; font-family:'Inter', sans-serif; }

/* the game HUD (cards, finger, celebration) at phone-readable size */
.film .hud { font-size:15px; }
.hud .hd-top, .hud .hd-mission { display:none; }
.hud .hd-cards { gap:.5em; bottom:1.1em; }
.hud .hd-pick { font-size:.82em; background:var(--blue); box-shadow:0 .2em 0 #1a4aa8; }
.hud .hd-card { font-size:1em; min-height:4.1em; font-weight:800; box-shadow:0 .32em 0 #b9c6d0, 0 .8em 1.6em rgba(0,0,0,.18); }
.hud .hd-card.picked { transform:translateY(-.3em) scale(1.06); }
.hud .hd-burst { top:40%; }
.hud .hd-burst p { font-size:1.2em; top:2.9em; background:var(--green); box-shadow:0 .25em 0 #0f5e32; }
.hud .hd-badge { top:6em; font-size:1.02em; }
.hud .hd-stars span { width:4em; height:4em; } .hud .hd-stars span:nth-child(2) { width:5.2em; height:5.2em; }

/* counters, like the game */
.chips { position:absolute; z-index:3; left:14px; top:14px; display:flex; gap:8px; }
.chip { display:flex; align-items:center; gap:7px; height:36px; padding:0 13px 0 6px; border-radius:99px; background:#fff; box-shadow:0 4px 0 rgba(12,27,36,.18), 0 8px 18px rgba(0,0,0,.14); font:850 15px/1 'Inter', sans-serif; color:var(--ink); font-variant-numeric:tabular-nums; }
.chip i { width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-style:normal; }
.chip i svg { width:16px; height:16px; fill:#fff; }
.chip.spk i { background:var(--sun); } .chip.spk i svg { fill:#7a4a00; }
.chip.hom i { background:var(--green); }
.chip b { color:var(--green); font-size:17px; }
.chip.spk b { color:#c77d00; }
.chip small { font-weight:750; font-size:13px; color:#3a4a55; }
.chip.bump { animation:bump .35s var(--pop); }
@keyframes bump { 40% { transform:scale(1.18); } }
.brand { position:absolute; z-index:3; right:14px; top:14px; display:flex; align-items:center; gap:7px; height:36px; padding:0 13px 0 5px; border-radius:99px; background:var(--green); color:#fff; box-shadow:0 4px 0 #0f5e32, 0 8px 18px rgba(0,0,0,.14); font:850 15px/1 'Inter', sans-serif; }
.brand span { width:27px; height:27px; border-radius:50%; background:#fff; display:grid; place-items:center; }
.brand svg { width:17px; height:17px; fill:var(--green); }
.chips, .brand { transition:opacity .4s, transform .5s var(--pop); }
.film.ended .chips, .film.ended .brand { opacity:0; transform:translateY(-10px); }

/* sticker captions */
.cap { position:absolute; z-index:6; left:0; right:0; top:74px; display:flex; justify-content:center; pointer-events:none; padding:0 26px; }
.cap b { display:inline-block; max-width:440px; padding:13px 22px 15px; border-radius:20px; background:var(--c, var(--sun)); color:var(--t, var(--ink)); font:800 33px/1.05 'Bricolage Grotesque', sans-serif; letter-spacing:-.02em; text-align:center; text-wrap:balance; box-shadow:0 7px 0 var(--s, #c99a00), 0 16px 30px rgba(0,0,0,.22); transform:rotate(var(--r, -2deg)) scale(.2); opacity:0; transition:transform .5s var(--pop), opacity .2s; }
.cap.on b { transform:rotate(var(--r, -2deg)) scale(1); opacity:1; }
.cap.out b { transform:rotate(var(--r, -2deg)) scale(.6) translateY(-20px); opacity:0; transition:.25s var(--ease); }
.cap.low { top:auto; bottom:30px; }
.cap b em { font-style:normal; color:var(--h, #fff); }
.cap.yellow { --c:var(--sun); --s:#c99a00; --t:var(--ink); --h:#e8453c; --r:-2.5deg; }
.cap.blue { --c:var(--blue); --s:#1a4aa8; --t:#fff; --h:var(--sun); --r:2deg; }
.cap.green { --c:var(--green); --s:#0f5e32; --t:#fff; --h:var(--sun); --r:-1.5deg; }
.cap.pink { --c:var(--pink); --s:#b3245a; --t:#fff; --h:var(--sun); --r:2deg; }

/* the power prize stamp */
.stamp { position:absolute; z-index:7; left:50%; top:46%; pointer-events:none; transition:opacity .3s; }
.stamp.out { opacity:0; }
.stamp b { position:absolute; left:0; top:0; transform:translate(-50%, -50%) rotate(-6deg) scale(3); opacity:0; white-space:nowrap; padding:10px 26px 14px; border-radius:22px; background:#fff; color:var(--blue); font:800 52px/1 'Bricolage Grotesque', sans-serif; letter-spacing:-.03em; box-shadow:0 8px 0 #c8d6e4, 0 20px 40px rgba(0,0,0,.25); }
.stamp b em { font-style:normal; color:#ffb400; }
.stamp i { position:absolute; left:-200px; top:-200px; width:400px; height:400px; border-radius:50%; background:repeating-conic-gradient(rgba(255,226,80,.85) 0 9deg, transparent 9deg 22deg); -webkit-mask:radial-gradient(circle, #000 20%, transparent 70%); mask:radial-gradient(circle, #000 20%, transparent 70%); opacity:0; transform:scale(.3); }
.stamp.on b { animation:stamp .5s var(--pop) forwards; }
.stamp.on i { animation:rays 2s ease-out forwards; }
.stamp.out b { opacity:0 !important; transform:translate(-50%, -50%) rotate(-6deg) scale(.5) !important; transition:.3s; animation:none; }
.stamp.out i { opacity:0; transition:.3s; animation:none; }
@keyframes stamp { to { opacity:1; transform:translate(-50%, -50%) rotate(-6deg) scale(1); } }
@keyframes rays { 0% { opacity:0; transform:scale(.3) rotate(0); } 25% { opacity:1; } 100% { opacity:.8; transform:scale(1.1) rotate(50deg); } }
.flash { position:absolute; inset:0; z-index:8; background:#fff; opacity:0; pointer-events:none; }
.flash.on { animation:flash .55s ease-out; }
@keyframes flash { 0% { opacity:.95; } 100% { opacity:0; } }

/* home power icons pinned over each house */
.hi { position:absolute; z-index:2; left:0; top:0; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; display:grid; place-items:center; background:#8a96a0; box-shadow:0 3px 0 rgba(0,0,0,.25); opacity:0; transition:opacity .3s, background .2s; }
.hi svg { width:18px; height:18px; fill:#fff; }
.hi::after { content:""; position:absolute; width:26px; height:3px; border-radius:2px; background:#fff; transform:rotate(-45deg); box-shadow:0 0 0 1.5px #8a96a0; }
.hi.show { opacity:1; }
.hi.on { background:var(--green); animation:hion .5s var(--pop); box-shadow:0 3px 0 #0f5e32, 0 0 0 4px rgba(255,255,255,.7), 0 0 18px 6px rgba(255,214,60,.8); }
.hi.on::after { display:none; }
@keyframes hion { 0% { scale:.4; } 60% { scale:1.35; } }
.prize-tag { position:absolute; z-index:2; left:0; top:0; padding:6px 12px 7px; border-radius:99px; background:var(--sun); color:var(--ink); font:850 14px/1 'Inter', sans-serif; white-space:nowrap; box-shadow:0 4px 0 #c99a00; opacity:0; transition:opacity .3s; }
.prize-tag.on { opacity:1; }

/* end card */
.end { position:absolute; inset:0; z-index:9; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 44px 40px; color:var(--ink); background:linear-gradient(150deg, #59C7FC 0%, #3fe0d0 55%, #16FFC6 100%); clip-path:circle(0% at 50% 50%); transition:clip-path .8s cubic-bezier(.6,0,.2,1); }
.end.on { clip-path:circle(80% at 50% 50%); }
.end > * { opacity:0; transform:translateY(22px) scale(.9); transition:opacity .4s, transform .6s var(--pop); }
.end.on > * { opacity:1; transform:none; }
.end.on > :nth-child(1) { transition-delay:.35s; } .end.on > :nth-child(2) { transition-delay:.5s; } .end.on > :nth-child(3) { transition-delay:.75s; } .end.on > :nth-child(4) { transition-delay:1s; } .end.on > :nth-child(5) { transition-delay:1.2s; }
.end .badge { width:86px; height:86px; border-radius:50%; background:var(--green); display:grid; place-items:center; box-shadow:0 7px 0 #0f5e32, 0 0 0 8px rgba(255,255,255,.55); margin-bottom:20px; }
.end .badge svg { width:52px; height:52px; fill:#fff; }
.end.on .badge { animation:spin 1.2s var(--pop) .35s both; }
@keyframes spin { from { transform:rotate(-200deg) scale(.2); } }
.end h2 { margin:0; font:800 78px/.92 'Bricolage Grotesque', sans-serif; letter-spacing:-.04em; color:#fff; text-shadow:0 5px 0 rgba(12,27,36,.18); }
.end p { margin:16px 0 22px; font:700 19px/1.35 'Inter', sans-serif; text-wrap:balance; }
.end .url { display:inline-block; padding:13px 24px 14px; border-radius:99px; background:var(--ink); color:#fff; font:850 20px/1 'Inter', sans-serif; box-shadow:0 5px 0 rgba(12,27,36,.3); }
.end .logo { position:absolute; left:50%; bottom:30px; width:210px; transform:translateX(-50%) !important; }
.end > :not(.conf) { z-index:1; }
.end > :not(.conf):not(.logo) { position:relative; }
.end .conf { position:absolute; inset:0; z-index:0; overflow:hidden; opacity:1 !important; transform:none !important; pointer-events:none; }
.end .conf i { position:absolute; top:-20px; width:12px; height:18px; border-radius:3px; background:var(--c); left:var(--x); animation:fall var(--d) linear var(--dl) infinite; }
@keyframes fall { to { transform:translateY(600px) rotate(720deg); } }
</style>
</head>
<body>
<div class="gw film" data-brand="eco">
  <canvas aria-hidden="true"></canvas>
  <div class="pins"></div>
  <div class="hudroot"></div>
  <div class="chips">
    <div class="chip spk"><i><svg viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.5h6.2L9.8 22l9-11.6h-6.2z"/></svg></i><b data-sparks>0</b><small>sparks</small></div>
    <div class="chip hom"><i><svg viewBox="0 0 24 24"><path d="M12 3 2.5 11h2.8v9.5h5.2v-6h3v6h5.2V11h2.8z"/></svg></i><b data-homes>0</b><small>of 11 homes on</small></div>
  </div>
  <div class="brand"><span><svg viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.5h6.2L9.8 22l9-11.6h-6.2z"/></svg></span>Power Run</div>
  <div class="cap"><b></b></div>
  <div class="stamp"><i></i><b>Power <em>prize!</em></b></div>
  <div class="flash"></div>
  <div class="end">
    <div class="badge"><svg viewBox="0 0 24 24"><path d="M13.5 2 4.5 13.5h6.2L9.8 22l9-11.6h-6.2z"/></svg></div>
    <h2>Power Run</h2>
    <p>An AI lab where children learn about clean energy by making choices and seeing what happens.</p>
    <div><span class="url">deltaopslearning.com</span></div>
    <img class="logo" src="/assets/logo-learning.svg" alt="DeltaOps Learning">
    <div class="conf"></div>
  </div>
</div>
<script type="module" src="/tools/social/power-run.js"></script>
</body>
</html>
